<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaMP34</title>
<style>
:root{--bg:#101214;--panel:#191c20;--panel2:#20242a;--line:#2b3038;--text:#eef0f2;--muted:#8d949d;--accent:#f1aa42;--good:#54d3a3;--bad:#e46b60}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#171b20 0,#101214 45%);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:7vh 18px 60px}.wrap{width:min(640px,100%)}.eyebrow{font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:.16em;text-transform:uppercase;text-align:center;margin-bottom:12px}.logo{text-align:center;font-weight:800;font-size:clamp(32px,7vw,48px);letter-spacing:-.04em;margin:0}.logo b{color:var(--accent)}.sub{text-align:center;color:var(--muted);margin:8px auto 30px;max-width:520px}.card{background:rgba(25,28,32,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 45px #0005}.input{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0 10px 0 14px}.input span{color:var(--accent);font-family:ui-monospace,monospace}.input input{width:100%;padding:15px 0;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.modes button,.primary,.save,.pin-btn,.cancel{border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:transparent;color:var(--muted);cursor:pointer;font-weight:700}.modes button.active{background:var(--accent);border-color:var(--accent);color:#1a1408}.row{display:flex;gap:10px;margin-top:12px}.select{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px}.primary{width:100%;margin-top:12px;background:var(--accent);border-color:var(--accent);color:#1a1408}.primary:disabled,.save:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;text-align:center;margin-top:12px;color:var(--muted)}.status.bad{color:var(--bad)}.status.good{color:var(--good)}.result{display:none;margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);gap:12px;align-items:center}.result.show{display:flex}.thumb{width:132px;height:74px;object-fit:cover;border-radius:8px;background:#111}.info{min-width:0;flex:1}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.size{color:var(--muted);font-size:12px;margin-top:4px}.save{margin-top:10px;width:100%;background:#242a31;color:var(--text)}.progress{display:none;margin-top:12px}.progress.show{display:block}.track{height:8px;background:#111;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .2s}.pmeta{text-align:center;color:var(--muted);font:12px ui-monospace,monospace;margin-top:6px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modal-box{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.modal h2{margin:0 0 8px}.modal p{margin:0;color:var(--muted);font-size:13px}.pin{width:100%;margin-top:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;outline:0}.pin-actions{display:flex;gap:8px;margin-top:10px}.pin-btn{flex:1;background:var(--accent);color:#1a1408;border-color:var(--accent)}.cancel{flex:1}.pin-error{min-height:18px;color:var(--bad);font-size:12px;margin-top:7px}footer{text-align:center;color:#5e646d;font-size:12px;margin-top:24px}
@media(max-width:560px){.result{align-items:flex-start;flex-wrap:wrap}.thumb{width:100%;height:170px}.save{flex-basis:100%}.modes{grid-template-columns:1fr}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">private media tool</div>
  <h1 class="logo">Media<b>MP34</b></h1>
  <p class="sub">Paste a YouTube link, choose video or MP3, then save the result directly to your device.</p>
  <section class="card">
    <div class="input"><span>&gt;</span><input id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" spellcheck="false"></div>
    <div class="modes">
      <button class="active" data-mode="video">VIDEO</button>
      <button data-mode="audio">AUDIO (MP3)</button>
      <button data-mode="auto">AUTO</button>
    </div>
    <div class="row"><select id="quality" class="select"><option value="best">Best available</option></select><select id="format" class="select" style="display:none"><option value="mp3">MP3 192 kbps</option></select></div>
    <button id="go" class="primary">Analyze</button>
    <div id="status" class="status"></div>
    <div id="progress" class="progress"><div class="track"><div id="fill" class="fill"></div></div><div id="pmeta" class="pmeta"></div></div>
    <div id="result" class="result"><img id="thumb" class="thumb" alt=""><div class="info"><div id="title" class="title"></div><div id="meta" class="meta"></div><div id="size" class="size"></div><button id="save" class="save">Save file</button></div></div>
  </section>
  <footer>Use only for media you are allowed to download. Temporary files are removed automatically.</footer>
</div>
<div id="modal" class="modal"><div class="modal-box"><h2>Private tool</h2><p>Enter the access PIN before starting a download.</p><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"><div id="pinError" class="pin-error"></div><div class="pin-actions"><button id="cancel" class="cancel">Cancel</button><button id="unlock" class="pin-btn">Unlock</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let mode='video',meta=null,job=null,poll=null,pinRequired=false;
function status(t,kind=''){const e=$('status');e.textContent=t;e.className='status '+kind}
function fmt(n){if(!n)return '';let v=n,u='B';if(v>1024){v/=1024;u='KB'}if(v>1024){v/=1024;u='MB'}if(v>1024){v/=1024;u='GB'}return `${v.toFixed(1)} ${u}`}
function fmtTime(s){if(!s&&s!==0)return '';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function setBusy(v){$('go').disabled=v;$('save').disabled=v}
for(const b of document.querySelectorAll('.modes')) b;document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('quality').style.display=(mode==='audio')?'none':'block';$('format').style.display=(mode==='audio')?'block':'none';if(meta)renderMeta(meta)})
function renderMeta(m){$('result').classList.add('show');$('title').textContent=m.title||'Untitled';$('meta').textContent=[m.uploader, m.duration?fmtTime(m.duration):''].filter(Boolean).join(' · ');$('thumb').src=m.thumbnail||'';$('thumb').style.display=m.thumbnail?'block':'none';if(mode==='audio')$('size').textContent=m.audio_filesize?`Estimated size: ${fmt(m.audio_filesize)}`:''}
async function analyze(){const url=$('url').value.trim();if(!url){status('Paste a URL first','bad');return}setBusy(true);$('result').classList.remove('show');status('Analyzing link…');try{const r=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not analyze that link.');meta=d;const q=$('quality');q.innerHTML=(d.qualities||[{value:'best',label:'Best available'}]).map(x=>`<option value="${x.value}">${x.label}</option>`).join('');renderMeta(d);status('Ready to download','good');$('go').textContent='Download'}catch(e){status(e.message,'bad')}finally{setBusy(false)}}
async function unlock(){const pin=$('pin').value;if(!pin){$('pinError').textContent='Enter the PIN.';return}$('unlock').disabled=true;try{const r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Incorrect PIN.');pinRequired=false;$('modal').classList.remove('show');await startDownload(true)}catch(e){$('pinError').textContent=e.message;$('pin').value='';$('pin').focus()}finally{$('unlock').disabled=false}}
$('cancel').onclick=()=> $('modal').classList.remove('show');$('unlock').onclick=unlock;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
async function startDownload(retry=false){const url=$('url').value.trim();if(!meta){await analyze();if(!meta)return}setBusy(true);$('progress').classList.add('show');$('fill').style.width='0%';$('pmeta').textContent='Starting…';status('Preparing download…');try{const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,mode:mode==='auto'?'video':mode,quality:$('quality').value})});const d=await r.json();if(r.status===401&&d.needs_pin&&!retry){$('modal').classList.add('show');setBusy(false);return}if(!r.ok)throw new Error(d.error||'Could not start download.');job=d.job_id;pollProgress()}catch(e){status(e.message,'bad');setBusy(false);$('progress').classList.remove('show')}}
function pollProgress(){clearInterval(poll);poll=setInterval(async()=>{try{const r=await fetch('/api/progress/'+job);const d=await r.json();if(!r.ok)throw new Error(d.error||'Lost download job.');if(typeof d.percent==='number')$('fill').style.width=d.percent+'%';$('pmeta').textContent=d.stage==='processing'?'Processing with FFmpeg…':d.percent!=null?`${d.percent}%${d.speed?' · '+fmt(d.speed)+'/s':''}${d.eta!=null?' · ETA '+fmtTime(d.eta):''}`:'Working…';if(d.status==='ready'){clearInterval(poll);$('fill').style.width='100%';$('pmeta').textContent='Ready';status('Download ready','good');setBusy(false);$('save').disabled=false;job=d}else if(d.status==='error'){clearInterval(poll);throw new Error(d.error||'Download failed.')}}catch(e){clearInterval(poll);status(e.message,'bad');$('progress').classList.remove('show');setBusy(false)}} ,700)}
$('save').onclick=()=>{if(!job||!job.job_id)return;window.location.href='/api/file/'+job.job_id};
$('go').onclick=()=>{$('go').textContent==='Analyze'?analyze():startDownload()};$('url').addEventListener('keydown',e=>{if(e.key==='Enter')analyze()});
fetch('/api/config').then(r=>r.json()).then(d=>{pinRequired=!!d.pin_required}).catch(()=>{});
</script>
</body>
</html>
