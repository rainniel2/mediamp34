<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grabit — paste a link, get the file</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171a;
    --panel:#1c1f23;
    --panel-2:#22262b;
    --line:#2b2f35;
    --text:#eceae6;
    --muted:#8b9098;
    --amber:#f2a93b;
    --amber-dim:#7a5a26;
    --teal:#4fd1a5;
    --red:#e2685c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8vh 20px 60px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--amber);
    margin-bottom:14px;
  }
  h1{
    font-size:clamp(28px,4vw,42px);
    margin:0 0 8px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  h1 span{color:var(--amber);}
  .sub{
    color:var(--muted);
    font-size:15px;
    margin:0 0 40px;
    text-align:center;
    max-width:440px;
    line-height:1.5;
  }
  .card{
    width:100%;
    max-width:560px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .input-row{
    display:flex;
    align-items:center;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0 6px 0 16px;
    transition:border-color .15s ease;
  }
  .input-row:focus-within{
    border-color:var(--amber-dim);
  }
  .prompt{
    font-family:'IBM Plex Mono',monospace;
    color:var(--amber);
    font-size:15px;
    margin-right:8px;
    user-select:none;
  }
  input#url{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    padding:14px 4px;
  }
  input#url::placeholder{color:#565b62;}
  .bars{
    display:flex;
    align-items:center;
    gap:3px;
    height:20px;
    margin-right:10px;
    opacity:0.5;
  }
  .bars span{
    width:3px;
    background:var(--amber);
    border-radius:2px;
    height:6px;
    transition:height .18s ease;
  }
  .bars.active span{ animation: pulse 0.9s ease-in-out infinite; }
  .bars span:nth-child(1){animation-delay:0s;}
  .bars span:nth-child(2){animation-delay:.12s;}
  .bars span:nth-child(3){animation-delay:.24s;}
  .bars span:nth-child(4){animation-delay:.36s;}
  @keyframes pulse{
    0%,100%{height:6px;}
    50%{height:18px;}
  }

  .modes{
    display:flex;
    gap:6px;
    margin:16px 0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
  }
  .modes button{
    flex:1;
    padding:9px 0;
    background:transparent;
    border:none;
    border-radius:7px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .modes button.active{
    background:var(--amber);
    color:#1a1305;
    font-weight:600;
  }

  .quality-select{
    width:100%;
    padding:11px 12px;
    margin-bottom:14px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    outline:none;
  }

  .progress-wrap{
    display:none;
    margin-top:14px;
  }
  .progress-wrap.show{display:block;}
  .progress-track{
    width:100%;
    height:8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:var(--amber);
    transition:width .25s ease;
  }
  .progress-fill.indeterminate{
    width:40%;
    animation:indet 1.2s ease-in-out infinite;
  }
  @keyframes indet{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(250%);}
  }
  .progress-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:6px;
    display:flex;
    justify-content:space-between;
  }

  .go{
    width:100%;
    padding:13px 0;
    border:none;
    border-radius:10px;
    background:var(--amber);
    color:#1a1305;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .go:hover{filter:brightness(1.08);}
  .go:active{transform:scale(0.99);}
  .go:disabled{
    background:var(--panel-2);
    color:var(--muted);
    cursor:not-allowed;
  }

  .status{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--muted);
    min-height:18px;
  }
  .status.error{color:var(--red);}
  .status.ok{color:var(--teal);}

  .result{
    display:none;
    margin-top:18px;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  .result.show{display:flex; gap:14px; align-items:center;}
  .result img{
    width:76px;height:76px;
    object-fit:cover;
    border-radius:8px;
    background:var(--panel-2);
    flex-shrink:0;
  }
  .result-info{flex:1; min-width:0;}
  .result-title{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:3px;
  }
  .dl-btn{
    background:var(--teal);
    color:#0c1f18;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .dl-btn:hover{filter:brightness(1.08);}

  footer{
    margin-top:34px;
    color:#565b62;
    font-size:12px;
    text-align:center;
    max-width:460px;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="eyebrow">link in, file out</div>
  <h1>grab<span>it</span></h1>
  <p class="sub">Paste a video, audio, or image link. Pick a format. Get the file — no accounts, no watermarks.</p>

  <div class="card">
    <div class="input-row">
      <span class="prompt">&gt;</span>
      <input id="url" type="text" placeholder="https://example.com/watch?v=..." autocomplete="off" spellcheck="false">
      <div class="bars" id="bars"><span></span><span></span><span></span><span></span></div>
    </div>

    <div class="modes">
      <button class="active" data-mode="auto">AUTO</button>
      <button data-mode="video">VIDEO</button>
      <button data-mode="audio">AUDIO (MP3)</button>
    </div>

    <select id="quality" class="quality-select" style="display:none;"></select>

    <button class="go" id="go">Fetch link</button>
    <div class="status" id="status"></div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta" id="progressMeta"></div>
    </div>

    <div class="result" id="result">
      <img id="thumb" src="" alt="">
      <div class="result-info">
        <div class="result-title" id="rtitle">—</div>
        <div class="result-meta" id="rmeta"></div>
      </div>
      <button class="dl-btn" id="dlBtn">Download</button>
    </div>
  </div>

  <footer>
    Only download things you have the right to — your own uploads, content licensed for reuse, or files you own. Respect the source platform's terms.
  </footer>

<script>
  const urlInput = document.getElementById('url');
  const bars = document.getElementById('bars');
  const goBtn = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const thumb = document.getElementById('thumb');
  const rtitle = document.getElementById('rtitle');
  const rmeta = document.getElementById('rmeta');
  const dlBtn = document.getElementById('dlBtn');
  const modeButtons = document.querySelectorAll('.modes button');
  const qualitySelect = document.getElementById('quality');
  const progressWrap = document.getElementById('progressWrap');
  const progressFill = document.getElementById('progressFill');
  const progressMeta = document.getElementById('progressMeta');

  let mode = 'auto';
  let currentUrl = '';
  let pollTimer = null;

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      modeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      qualitySelect.style.display = (mode === 'video' && qualitySelect.options.length) ? 'block' : 'none';
    });
  });

  function setStatus(text, kind){
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function setBusy(busy){
    goBtn.disabled = busy;
    bars.classList.toggle('active', busy);
  }

  function formatBytes(bytes){
    if(!bytes) return '';
    const mb = bytes / (1024*1024);
    return mb >= 1000 ? (mb/1024).toFixed(1)+' GB' : mb.toFixed(1)+' MB';
  }

  function formatSpeed(bps){
    if(!bps) return '';
    return formatBytes(bps) + '/s';
  }

  function formatEta(sec){
    if(sec === null || sec === undefined) return '';
    const m = Math.floor(sec/60), s = Math.round(sec%60);
    return `${m}:${s.toString().padStart(2,'0')} left`;
  }

  async function fetchInfo(){
    const url = urlInput.value.trim();
    if(!url){ setStatus('Paste a link first.', 'error'); return; }
    currentUrl = url;
    resultEl.classList.remove('show');
    progressWrap.classList.remove('show');
    qualitySelect.style.display = 'none';
    qualitySelect.innerHTML = '';
    setBusy(true);
    setStatus('Reading link…');
    try{
      const res = await fetch('/api/info', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url})
      });
      const data = await res.json();
      if(!res.ok){ setStatus(data.error || 'Something went wrong.', 'error'); setBusy(false); return; }

      rtitle.textContent = data.title || 'Untitled';
      rmeta.textContent = [
        data.uploader,
        data.duration ? formatDuration(data.duration) : null
      ].filter(Boolean).join(' · ') || 'Ready to download';
      thumb.src = data.thumbnail || '';
      thumb.style.display = data.thumbnail ? 'block' : 'none';
      resultEl.classList.add('show');
      setStatus('Found it.', 'ok');

      if(data.qualities && data.qualities.length){
        data.qualities.forEach(q => {
          const opt = document.createElement('option');
          opt.value = q.value;
          opt.textContent = q.label;
          qualitySelect.appendChild(opt);
        });
        qualitySelect.style.display = (mode === 'video') ? 'block' : 'none';
      }
    }catch(err){
      setStatus('Network error — is the server running?', 'error');
    }
    setBusy(false);
  }

  function formatDuration(sec){
    sec = Math.round(sec);
    const m = Math.floor(sec/60), s = sec%60;
    return `${m}:${s.toString().padStart(2,'0')}`;
  }

  async function doDownload(){
    if(!currentUrl){ return; }
    setBusy(true);
    progressWrap.classList.add('show');
    progressFill.classList.add('indeterminate');
    progressFill.style.width = '';
    progressMeta.textContent = '';
    setStatus('Starting…');

    try{
      const startRes = await fetch('/api/start', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({url: currentUrl, mode, quality: qualitySelect.value || 'best'})
      });
      const startData = await startRes.json();
      if(!startRes.ok){
        setStatus(startData.error || 'Could not start download.', 'error');
        setBusy(false);
        progressWrap.classList.remove('show');
        return;
      }
      pollProgress(startData.job_id);
    }catch(err){
      setStatus('Network error starting download.', 'error');
      setBusy(false);
      progressWrap.classList.remove('show');
    }
  }

  function pollProgress(jobId){
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try{
        const res = await fetch(`/api/progress/${jobId}`);
        const data = await res.json();
        if(!res.ok){
          clearInterval(pollTimer);
          setStatus(data.error || 'Lost track of that download.', 'error');
          setBusy(false);
          progressWrap.classList.remove('show');
          return;
        }

        if(typeof data.percent === 'number'){
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = data.percent + '%';
        }
        const parts = [];
        if(data.speed) parts.push(formatSpeed(data.speed));
        if(data.eta !== undefined && data.eta !== null) parts.push(formatEta(data.eta));
        progressMeta.textContent = parts.join(' · ');

        if(data.stage === 'processing'){
          setStatus('Processing (merging/converting)…');
        } else {
          setStatus('Downloading…');
        }

        if(data.status === 'finished'){
          clearInterval(pollTimer);
          progressFill.style.width = '100%';
          setStatus('Grabbing the file…');
          await deliverFile(jobId);
        } else if(data.status === 'error'){
          clearInterval(pollTimer);
          setStatus(data.error || 'Download failed.', 'error');
          setBusy(false);
          progressWrap.classList.remove('show');
        }
      }catch(err){
        clearInterval(pollTimer);
        setStatus('Network error while checking progress.', 'error');
        setBusy(false);
      }
    }, 800);
  }

  async function deliverFile(jobId){
    try{
      const res = await fetch(`/api/result/${jobId}`);
      if(!res.ok){
        const data = await res.json().catch(()=>({}));
        setStatus(data.error || 'Could not retrieve the file.', 'error');
        setBusy(false);
        return;
      }
      const blob = await res.blob();
      const disposition = res.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : 'download';

      const a = document.createElement('a');
      const objUrl = URL.createObjectURL(blob);
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objUrl);
      setStatus('Downloaded.', 'ok');
    }catch(err){
      setStatus('Network error retrieving the file.', 'error');
    }
    setBusy(false);
    progressWrap.classList.remove('show');
  }

  goBtn.addEventListener('click', fetchInfo);
  dlBtn.addEventListener('click', doDownload);
  urlInput.addEventListener('keydown', e => { if(e.key === 'Enter') fetchInfo(); });
</script>
</body>
</html>
